services:
  redpanda:
    image: &redpanda-image docker.redpanda.com/redpandadata/redpanda:v26.2.5@sha256:badca2d958f81da675c3055a9ecb6ebb590325582bcf16936148ffd65e96e920
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --kafka-addr=0.0.0.0:9092
      - --advertise-kafka-addr=redpanda:9092
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 24
    mem_limit: 2g
  topics:
    image: *redpanda-image
    # The CLI helper needs no broker data; mask the image's anonymous VOLUME.
    tmpfs: ["/var/lib/redpanda/data:size=1m"]
    entrypoint: ["rpk"]
    command: ["topic", "create", "edits", "results", "ingest-errors", "processing-errors", "sink-errors", "--if-not-exists", "--partitions", "1", "--replicas", "1", "-X", "brokers=redpanda:9092"]
    depends_on:
      redpanda:
        condition: service_healthy
  postgres:
    image: &postgres-image postgres:16.15-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
    environment:
      POSTGRES_DB: triage
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/001-foundation.sql:/docker-entrypoint-initdb.d/001-foundation.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U triage -d triage"]
      interval: 5s
      timeout: 5s
      retries: 24
    mem_limit: 512m
  connect:
    image: &connect-image docker.redpanda.com/redpandadata/connect:4.114.0@sha256:481e8df48ed733f080623ae67f0dccc82d29ae509dfb3f957347a9e900e74910
    command: ["run", "--disable-telemetry", "/config/ingest.yaml"]
    environment:
      INGEST_STREAM_URL: ${INGEST_STREAM_URL:-https://stream.wikimedia.org/v2/stream/recentchange}
      INGEST_RECONNECT: ${INGEST_RECONNECT:-true}
      INGEST_SOURCE: ${INGEST_SOURCE:-wikimedia-recentchange}
      INGEST_SAMPLE_ALL: ${INGEST_SAMPLE_ALL:-false}
    volumes:
      - ./connect:/config:ro
    ports:
      - "127.0.0.1:${CONNECT_PORT:-4195}:4195"
    depends_on:
      topics:
        condition: service_completed_successfully
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    stop_grace_period: 25s
  db-migrate:
    image: *postgres-image
    # psql connects to the real database; this helper never owns a data directory.
    tmpfs: ["/var/lib/postgresql/data:size=1m"]
    entrypoint: ["psql"]
    command: ["-h", "postgres", "-U", "triage", "-d", "triage", "-v", "ON_ERROR_STOP=1", "-f", "/migrations/002-results.sql"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      PGCONNECT_TIMEOUT: "5"
    volumes:
      - ./db:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    user: "10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  sink:
    image: *connect-image
    command: ["run", "--disable-telemetry", "/config/sink.yaml"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      SINK_GROUP_ID: ${SINK_GROUP_ID:-triage-store-v1}
    volumes:
      - ./connect:/config:ro
      - ./schemas:/schemas:ro
    ports:
      - "127.0.0.1:${SINK_PORT:-4196}:4196"
    depends_on:
      topics:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    stop_grace_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  api:
    build: .
    command: ["uvicorn", "triage.api:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--no-access-log", "--limit-concurrency", "32", "--timeout-graceful-shutdown", "10"]
    environment:
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).close()"]
      interval: 5s
      timeout: 6s
      retries: 24
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  fixture-source:
    profiles: ["tools"]
    image: python:3.13.16-slim-bookworm@sha256:a1165e272e578941b84abc79e4ab38a0305cd12803a5c4247979ac7655f4d641
    command: ["python", "-m", "http.server", "8080", "--directory", "/fixtures"]
    volumes:
      - ./tests/fixtures/ingestion:/fixtures:ro
    user: "10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/phase-2.sse', timeout=2).close()"]
      interval: 1s
      timeout: 3s
      retries: 20
  model-check:
    profiles: ["tools"]
    build: .
    command: ["triage", "smoke-model"]
    environment: &worker-environment
      KAFKA_BROKERS: ${KAFKA_BROKERS:-redpanda:9092}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-triage-v1}
      WORKER_MAX_ITEMS: ${WORKER_MAX_ITEMS:-10}
      LLM_BACKEND: ${LLM_BACKEND:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1024}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
  worker:
    build: .
    command: ["triage", "worker"]
    environment: *worker-environment
    depends_on:
      topics:
        condition: service_completed_successfully
    extra_hosts: ["host.docker.internal:host-gateway"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    stop_grace_period: 540s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  redpanda-data:
  postgres-data:
