services:
  redpanda:
    extends:
      file: compose.infrastructure.yml
      service: redpanda
  topics:
    extends:
      file: compose.infrastructure.yml
      service: topics
  postgres:
    extends:
      file: compose.infrastructure.yml
      service: postgres
  connect:
    extends:
      file: compose.infrastructure.yml
      service: connect
  fixture-source:
    extends:
      file: compose.infrastructure.yml
      service: fixture-source
  model-check:
    extends:
      file: compose.infrastructure.yml
      service: model-check
  worker:
    extends:
      file: compose.infrastructure.yml
      service: worker
    depends_on:
      model-init:
        condition: service_completed_successfully
  db-migrate:
    extends:
      file: compose.infrastructure.yml
      service: db-migrate
  sink:
    extends:
      file: compose.infrastructure.yml
      service: sink
  api:
    extends:
      file: compose.infrastructure.yml
      service: api
  ollama:
    image: &ollama-image ollama/ollama:0.40.8@sha256:2b8eecdb85aa6ea67c381c8ecffec04b2658496cf2821a8f88b0485bdff198e8
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 24
    mem_limit: 8g
  model-init:
    image: *ollama-image
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-qwen2.5:7b}"]
    depends_on:
      ollama:
        condition: service_healthy
volumes:
  redpanda-data:
  postgres-data:
  ollama-data:
