# Native tests for the production Connect processors.
tests:
  - name: "projects exact fields and UTC timestamp"
    target_processors: ingest.yaml#/pipeline/processors
    environment: {"INGEST_SOURCE": "fixture", "INGEST_SAMPLE_ALL": "true"}
    input_batch:
      - content: "event: message\nid: fixture-1\ndata: {\"wiki\":\"enwiki\",\"type\":\"edit\",\"namespace\":0,\"bot\":false,\"title\":\"Example article\",\"revision\":{\"old\":100,\"new\":101},\"timestamp\":1792490400}\n\n"
    output_batches:
      - - json_equals: {"schema_version": 1, "wiki": "enwiki", "title": "Example article", "old_revision_id": 100, "revision_id": 101, "occurred_at": "2026-10-20T10:00:00Z"}
          metadata_equals: {"event_key": "enwiki:101", "outcome": "accepted", "source": "fixture", "source_id": "fixture-1", "ingest_version": "1"}
  - name: "handles CRLF frames"
    target_processors: ingest.yaml#/pipeline/processors
    environment: {"INGEST_SOURCE": "fixture", "INGEST_SAMPLE_ALL": "true"}
    input_batch:
      - content: "event: message\r\nid: fixture-1\r\ndata: {\"wiki\":\"enwiki\",\"type\":\"edit\",\"namespace\":0,\"bot\":false,\"title\":\"Example article\",\"revision\":{\"old\":100,\"new\":101},\"timestamp\":1792490400}\r\n\r\n"
    output_batches:
      - - json_equals: {"schema_version": 1, "wiki": "enwiki", "title": "Example article", "old_revision_id": 100, "revision_id": 101, "occurred_at": "2026-10-20T10:00:00Z"}
          metadata_equals: {"event_key": "enwiki:101", "outcome": "accepted", "source": "fixture", "source_id": "fixture-1", "ingest_version": "1"}
  - name: "joins multiline data"
    target_processors: ingest.yaml#/pipeline/processors
    environment: {"INGEST_SOURCE": "fixture", "INGEST_SAMPLE_ALL": "true"}
    input_batch:
      - content: "event: message\nid: fixture-1\ndata: {\"wiki\":\"enwiki\",\"type\":\"edit\",\"namespace\":0,\"bot\":false,\"title\":\"Example article\",\ndata: \"revision\":{\"old\":100,\"new\":101},\"timestamp\":1792490400}\n\n"
    output_batches:
      - - json_equals: {"schema_version": 1, "wiki": "enwiki", "title": "Example article", "old_revision_id": 100, "revision_id": 101, "occurred_at": "2026-10-20T10:00:00Z"}
          metadata_equals: {"event_key": "enwiki:101", "outcome": "accepted", "source": "fixture", "source_id": "fixture-1", "ingest_version": "1"}
  - name: "ignores comments within a frame"
    target_processors: ingest.yaml#/pipeline/processors
    environment: {"INGEST_SOURCE": "fixture", "INGEST_SAMPLE_ALL": "true"}
    input_batch:
      - content: "event: message\nid: fixture-1\n: keepalive\ndata: {\"wiki\":\"enwiki\",\"type\":\"edit\",\"namespace\":0,\"bot\":false,\"title\":\"Example article\",\"revision\":{\"old\":100,\"new\":101},\"timestamp\":1792490400}\n\n"
    output_batches:
      - - json_equals: {"schema_version": 1, "wiki": "enwiki", "title": "Example article", "old_revision_id": 100, "revision_id": 101, "occurred_at": "2026-10-20T10:00:00Z"}
          metadata_equals: {"event_key": "enwiki:101", "outcome": "accepted", "source": "fixture", "source_id": "fixture-1", "ingest_version": "1"}
